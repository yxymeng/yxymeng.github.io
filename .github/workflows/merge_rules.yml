# .github/workflows/merge_rules.yml
# 作用：每天北京时间凌晨 3:17 或手动触发 merge_rules.py，成功后仅提交真正发生变化的 Ruleset/Merged 文件。

name: 合并规则工作流

# merge_rules.py 需要把生成结果提交回当前仓库，因此授予 contents 写权限。
permissions:
  contents: write

# 防止定时任务和手动任务同时修改同一批规则文件；新任务启动时取消仍在执行的旧任务。
concurrency:
  group: merge-rules
  cancel-in-progress: true

on:
  # GitHub Actions 页面可随时点击 Run workflow 手动运行。
  workflow_dispatch:
  # GitHub cron 使用 UTC。UTC 19:17 = 北京时间次日凌晨 03:17，并避开整点高负载时段。
  schedule:
    - cron: '17 19 * * *'

jobs:
  merge:
    name: 合并、校验并更新规则
    runs-on: ubuntu-latest

    steps:
      # 1. 把仓库检出到 ${{ github.workspace }}。后续 run 默认就在这个仓库根目录执行。
      - name: Checkout 仓库
        uses: actions/checkout@v7
        with:
          persist-credentials: true

      # 2. 固定 Python 版本，避免 ubuntu-latest 自带 Python 变化导致行为漂移。
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # 3. 安装 merge_rules.py 唯一的第三方依赖。
      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: python -m pip install -r requirements.txt

      # 4. 执行规则合并。任何配置错误、下载连续失败或处理异常都会返回非 0，工作流立即失败且不会进入提交步骤。
      - name: Run merge script
        working-directory: ${{ github.workspace }}
        run: python merge_rules.py

      # 5. 逐分类检查输出文件和规则总数；摘要区分内容变化与沿用旧文件，避免把未提交误判为未生成。
      - name: Verify generated files
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from merge_rules import CONFIG_FILE, OUTPUT_DIR

          config = json.loads(CONFIG_FILE.read_text(encoding="utf-8-sig"))
          summary = ["| 分类 | 输出文件 | 规则数 | 内容更新时间（北京） | 本轮结果 |",
                     "| --- | --- | ---: | --- | --- |"]
          for category in config:
              path = OUTPUT_DIR / f"{category}.list"
              if not path.is_file():
                  raise SystemExit(f"Missing generated output: {path}")
              lines = path.read_text(encoding="utf-8-sig").splitlines()
              rules = [line for line in lines if line.strip() and not line.startswith("#")]
              headers = dict(line[2:].split(": ", 1) for line in lines if line.startswith("# ") and ": " in line)
              if headers.get("TOTAL") != str(len(rules)):
                  raise SystemExit(f"Rule count mismatch: {path} | TOTAL={headers.get('TOTAL')} | actual={len(rules)}")
              changed = subprocess.check_output(["git", "status", "--porcelain", "--", str(path)], text=True).strip()
              status = "内容变化，待提交" if changed else "内容未变，沿用已有文件"
              updated = headers.get("UPDATED", "未知")
              print(f"VERIFY [{category}] | 文件={path} | TOTAL={len(rules)} | UPDATED={updated} | {status}")
              summary.append(f"| {category} | `{path}` | {len(rules)} | {updated} | {status} |")
          summary.append("\n输出文件名严格使用分类名（区分大小写）；内容未变时保留 UPDATED，不产生规则提交。\n")
          if os.environ.get("GITHUB_STEP_SUMMARY"):
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as file:
                  file.write("\n".join(summary))
          PY

      # 6. 只提交真正改变的文件。merge_rules.py 已忽略 UPDATED 时间差，因此上游规则无变化时这里不会产生无意义 commit。
      - name: Commit & Push changes
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Ruleset/Merged

          if git diff --cached --quiet; then
            echo "No rule changes. Nothing to commit."
            exit 0
          fi

          echo "===== Changed files ====="
          git diff --cached --name-status
          git diff --cached --stat
          git commit -m "Auto merge and update Clash rules"
          git push
